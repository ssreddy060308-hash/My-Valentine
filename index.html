<!DOCTYPE html>
<html>
<head>
  <title>My Valentine</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fecfef);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      position: relative;
      width: 340px;
      height: 200px;
    }
    h1 { color: #ff4d6d; font-size: 22px; }
    p { color: #555; font-size: 14px;}
    button {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      position: absolute;
    }
    .yes { background: #4ade80; color: white; }
    .no { background: #f87171; color: white; bottom: 40px; left: 50%; transform: translateX(-50%); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my best friend forever? ❤️</h1>
    <p>we will continue this friendship life long</p>
    <button class="yes" id="yesBtn" onmouseover="moveYes()">Yes</button>
    <button class="no" onclick="alert('Aww... 😢 But we will be friends forever')">No</button>
  </div>

<script>
  function moveYes() {
    let btn = document.getElementById('yesBtn');
    let card = document.querySelector('.card');
    let x = Math.floor(Math.random() * (card.offsetWidth - 100));
    let y = Math.floor(Math.random() * (card.offsetHeight - 80));
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }
</script>
</body>
</html>
