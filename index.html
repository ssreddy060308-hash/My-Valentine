<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Promise</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #ff6b81;
            font-size: 28px;
            margin-bottom: 20px;
        }
        p {
            color: #333;
            font-size: 20px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }
        #yesBtn {
            background: #ff6b81;
            color: white;
        }
        #noBtn {
            background: #ccc;
            color: white;
            position: absolute;
        }
        #yesBtn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Will continue this friendship life long ❤️</h1>
        <p id="message"></p>
        <button class="btn" id="yesBtn">Yes</button>
        <button class="btn" id="noBtn">No</button>
    </div>

    <script>
        // URL nunchi peru theeskuntundi
        const urlParams = new URLSearchParams(window.location.search);
        const fromName = urlParams.get('from') || 'Friend';
        const toName = urlParams.get('to') || 'You';

        // Message set cheyadam
        document.getElementById('message').innerText = `${toName}, Will you promise me?`;

        // Yes button click
        document.getElementById('yesBtn').onclick = function() {
            document.querySelector('.container').innerHTML = 
            `<h1>Congratulations! 🎉</h1>
             <p>I knew you would say Yes ❤️</p>
             <p>From: ${fromName}</p>`;
        }

        // No button dorikipoyela
        const noBtn = document.getElementById('noBtn');
        noBtn.onmouseover = function() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }
    </script>
</body>
</html>
