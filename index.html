<!DOCTYPE html>
<html>
<head>
  <title>My Valentine</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fecfef);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
      margin: 0;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: relative;
    }
    h1 { color: #ff4d6d; font-size: 28px; }
    p { color: #555; }
    button {
      padding: 12px 30px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      position: relative;
      transition: 0.3s;
    }
    .yes { background: #4ade80; color: white; }
    .no { background: #f87171; color: white; position: absolute; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my best friend forever? ❤️</h1>
    <p>we will continue this friendship life long</p>
    <button class="yes" onclick="alert('Yayyy! I love you so much! ❤️')">Yes</button>
    <button class="no" id="noBtn" onmouseover="moveButton()">No</button>
  </div>

<script>
  function moveButton() {
    const btn = document.getElementById('noBtn');
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }
</script>
</body>
</html>
