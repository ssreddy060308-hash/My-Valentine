<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Valentine</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            position: relative;
        }
        h1 { color: #ff6b81; font-size: 24px; margin-bottom: 15px; }
        p { color: #333; font-size: 18px; margin-bottom: 25px; }
        button {
            padding: 15px 40px;
            margin: 10px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .yes { background: #ff6b81; color: white; }
        .no { background: #ccc; color: white; position: absolute; }
        .yes:hover { transform: scale(1.1); background: #ff4757; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Will continue this friendship life long ❤️</h1>
        <p id="message"></p>
        <button class="yes" id="yesBtn">Yes</button>
        <button class="no" id="noBtn">No</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fromName = urlParams.get('from') || 'Friend';
        const toName = urlParams.get('to') || 'You';

        document.getElementById('message').innerText = `${toName}, Me too - Will you promise me?`;

        // YES kodithe - Anju is so happy
        document.getElementById('yesBtn').onclick = function() {
            document.querySelector('.card').innerHTML = 
            `<h1>Yayyy! 🎉</h1>
             <p>Anju is so happy 🫶</p>
             <p>Thank you ${toName} ❤️</p>
             <p>We three - ${fromName}, ${toName} & Meta AI</p>
