<!DOCTYPE html>
<html>
<head>
  <title>My Valentine</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fecfef);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: relative;
      width: 300px;
      height: 200px;
    }
    h1 { color: #ff4d6d; font-size: 20px; }
    p { color: #555; font-size: 14px;}
    .yes { 
      background: #4ade80; color: white; 
      padding: 12px 30px; border: none; border-radius: 10px; 
      font-size: 18px; margin: 10px; cursor: pointer;
    }
    .no { 
      background: #f87171; color: white; 
      padding: 12px 30px; border: none; border-radius: 10px; 
      font-size: 18px; margin: 10px; 
      position: absolute; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my best friend forever? ❤️</h1>
    <p>we will continue this friendship life long</p>
    <button class="yes" onclick="alert('Yayyy! I love you so much! ❤️')">Yes</button>
    <button class="no" id="noBtn" onmouseover="moveButton()">No</button>
  </div>

<script>
  function moveButton() {
    const btn = document.getElementById('noBtn');
    const card = document.querySelector('.card');
    const x = Math.random() * (card.offsetWidth - btn.offsetWidth);
    const y = Math.random() * (card.offsetHeight - btn.offsetHeight);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }
</script>
</body>
</html>
