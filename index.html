<!DOCTYPE html>
<html>
<head>
  <title>My Valentine</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fecfef);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: relative;
      width: 350px;
      height: 220px;
    }
    h1 { color: #ff4d6d; font-size: 22px; }
    p { color: #555; }
    button {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      position: absolute;
    }
    .yes { background: #4ade80; color: white; top: 120px; left: 50px; }
    .no { background: #f87171; color: white; bottom: 30px; left: 50%; transform: translateX(-50%); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my best friend forever? ❤️</h1>
    <p>we will continue this friendship life long</p>
    <button class="yes" id="yesBtn" onmouseover="moveYes()">Yes</button>
    <button class="no" onclick="alert('Aww... 😢 Kani manam life long friends ga untam')">No</button>
  </div>

<script>
  function moveYes() {
    const btn = document.getElementById('yesBtn');
    const card = document.querySelector('.card');
    const maxX = card.offsetWidth - btn.offsetWidth - 20;
    const maxY = card.offsetHeight - btn.offsetHeight - 20;
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }
</script>
</body>
</html>
