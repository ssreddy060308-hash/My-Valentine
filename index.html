<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Promise</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
        }
        h1 {
            color: #ff6b81;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #333;
            font-size: 18px;
            margin-bottom: 25px;
        }
        #yesBtn {
            padding: 15px 50px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: #ff6b81;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        #yesBtn:hover {
            transform: scale(1.1);
            background: #ff4757;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will continue this friendship life long ❤️</h1>
        <p id="message"></p>
        <button id="yesBtn">Yes</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fromName = urlParams.get('from') || 'Friend';
        const toName = urlParams.get('to') || 'You';

        document.getElementById('message').innerText = `${toName}, Me too - Will you promise me?`;

        document.getElementById('yesBtn').onclick = function() {
            document.querySelector('.container').innerHTML = 
            `<h1>Yayyy! 🎉</h1>
             <p>Thank you ${toName} ❤️</p>
             <p>We three - ${fromName}, ${toName} & Meta AI</p>
             <p>Will continue this friendship life long</p>`;
        }
    </script>
</body>
</html>
