<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my best friend forever?❤️</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(150deg, #ff6b6b 0%, #ff8e53 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container {
  background: white;
  border-radius: 20px;
  padding: 50px 40px;
  box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
  max-width: 450px;
  width: 100%;
  text-align: center;
}
h1 {
  color: #ff6b6b;
  margin-bottom: 15px;
}
p {
  color: #555;
}
</style>
</head>
<body>
<div class="container">
  <h1>Will you be my best friend forever?❤️</h1>
  <p>we will continue this friendship life long</p>
</div>
</body>
</html> 
<!DOCTYPE html>
<html>
<head>
  <title>My Valentine</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fecfef);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    h1 { color: #ff4d6d; }
    button {
      padding: 12px 30px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    .yes { background: #4ade80; color: white; }
    .no { background: #f87171; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my best friend forever? ❤️</h1>
    <p>we will continue this friendship life long</p>
    <button class="yes" onclick="alert('Yayyy! I love you so much! ❤️')">Yes</button>
    <button class="no" onclick="alert('Aww... but we will still be friends 😊')">No</button>
  </div>
</body>
</html>
